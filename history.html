<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Version History</title>
  <style>
    body {
      background-color: #2c2f33;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      margin: 0;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { border-bottom: 2px solid #7289da; padding-bottom: 10px; margin-bottom: 30px; }
    
    /* 履歴ブロックのデザイン */
    .version-block {
      background-color: #23272a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #40444b;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .version-number { font-size: 1.4em; font-weight: bold; color: #43b581; }
    .version-date { color: #99aab5; font-size: 0.9em; }
    
    /* リストのデザイン調整 */
    ul { padding-left: 20px; margin: 0; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="historyPageTitle"></h1>

    <div id="changelog_list"></div>
    
  </div>
  <script src="history.js"></script>
</body>
</html>
