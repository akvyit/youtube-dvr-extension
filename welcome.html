<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <style>
    body {
      background-color: #2c2f33;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 650px;
      text-align: center;
    }
    h1 { color: #43b581; margin-bottom: 40px; }
    
    .step {
      background-color: #23272a;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      text-align: left;
    }
    .step-title {
      font-weight: bold;
      font-size: 1.3em;
      margin-bottom: 15px;
      color: #7289da;
      border-bottom: 2px solid #2c2f33;
      padding-bottom: 10px;
    }
    .step p {
      line-height: 1.6;
    }

    /* 画像のスタイル */
    .guide-image {
      max-width: 100%;
      height: auto;
      border: 1px solid #40444b;
      border-radius: 6px;
      
      /* ★ここを変更しました（中央揃え） */
      margin: 20px auto 0 auto;
      
      display: block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="welcomeTitle"></h1>
    
    <div class="step">
      <div class="step-title">Step 1: <span data-i18n="stepPinTitle"></span></div>
      <p>
        <span data-i18n="stepPinDesc1"></span><br>
        <span style="font-size:0.9em; color:#99aab5;" data-i18n="stepPinDesc2"></span>
      </p>
      <img data-i18n="pinGuideImg" class="guide-image" alt="Pin Guide">
    </div>

    <div class="step">
      <div class="step-title">Step 2: <span data-i18n="stepUsageTitle"></span></div>
      <p data-i18n="stepUsageDesc"></p>
      <img data-i18n="usageGuideImg" class="guide-image" alt="Usage Guide">
    </div>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
